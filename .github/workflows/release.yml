name: Release

# Push a tag such as v0.1.0 to publish that version to npm.
# One-time setup on npmjs.com: package settings → Trusted Publisher → GitHub Actions,
# with this repository and the workflow file name `release.yml`. No NPM_TOKEN secret is needed.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted Publishing needs a recent npm CLI.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require(`./package.json`).version')" = "$GITHUB_REF_NAME"
      - run: npm publish # prepublishOnly builds and runs publint + attw
